# 数据配置
data:
  root: "/home/duanmu/data/vitpose_v3/vitpose_v3/save_path_15"
  train_dir: "train"
  val_dir: "val"
  test_dir: "test"
  image_size: 336

# 训练配置
training:
  batch_size: 24
  max_epochs: 100
  num_workers: 8
  learning_rate: 0.0001
  train_stage: "3d"

# 模型配置
model:
  local_model_dir: "./dinov2-base-local"
  fastvit_ckpt_path: "./pretrained_weights/fastvit_ma36_apple_in1k.safetensors"
  ckpt_path: ""
  joint_prior_path: "./pre_train/joint_query_prior.pt"
  enable_auxiliary_loss: true
  lambda_aux: 0.2
  gamma: 0.5
  distance_embed_dim: 32
  auxiliary_hidden_dim: 256
  use_gradient_checkpointing: true

# 随机种子
seed: 42
