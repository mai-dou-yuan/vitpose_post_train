data:
  root: "dexycb/sampled_30k_3p8k_seed42"
  # image_size: 336
  image_size: 512

training:
  batch_size: 12
  max_epochs: 100
  num_workers: 8
  learning_rate: 0.0001
  accelerator: "auto"
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  early_stop_patience: 10

model:
  local_model_dir: "dinov2-base-local"
  ckpt_path: ""
  joint_prior_path: ""

output:
  checkpoint_dir: "experiments_graphormer_dexycb/outputs/checkpoints"
  default_root_dir: "experiments_graphormer_dexycb/outputs"

seed: 42
